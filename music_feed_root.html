<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musik Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --bg2: #141414;
    --bg3: #1a1a1a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8e4dc;
    --text2: #888;
    --text3: #555;
    --accent: #c8f060;
    --accent2: #8fb840;
    --radius: 6px;
    --sidebar: 260px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 52px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .logo span { color: var(--text3); font-weight: 300; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .tag-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 20px;
  }

  /* LAYOUT */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar) 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg2);
  }
  .sidebar-top {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 10px 6px 28px;
    outline: none;
  }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-wrap input:focus { border-color: var(--border2); }
  .search-icon {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 13px;
    pointer-events: none;
  }
  .tree-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }
  .tree-scroll::-webkit-scrollbar { width: 3px; }
  .tree-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* TREE */
  .genre-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.15s;
    user-select: none;
  }
  .genre-row:hover { color: var(--text); }
  .genre-row.active { color: var(--accent); }
  .genre-arrow { font-size: 10px; transition: transform 0.15s; color: var(--text3); }
  .genre-arrow.open { transform: rotate(90deg); }
  .genre-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .genre-count {
    margin-left: auto;
    font-size: 10px;
    color: var(--text3);
    font-weight: 300;
  }

  .band-group { display: none; }
  .band-group.open { display: block; }

  .band-row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 16px 5px 30px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text3);
    transition: color 0.15s;
    user-select: none;
  }
  .band-row:hover { color: var(--text2); }
  .band-row.active { color: var(--text); }
  .band-arrow { font-size: 9px; transition: transform 0.15s; }
  .band-arrow.open { transform: rotate(90deg); }

  .track-group { display: none; }
  .track-group.open { display: block; }

  .track-row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 16px 4px 48px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text3);
    transition: color 0.15s;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
  }
  .track-row:hover { color: var(--accent); }
  .track-row::before {
    content: '—';
    color: var(--text3);
    font-size: 10px;
  }

  /* MAIN */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .main-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 48px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .view-tabs { display: flex; gap: 2px; }
  .view-tab {
    padding: 4px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    cursor: pointer;
    border-radius: var(--radius);
    border: none;
    background: none;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .view-tab:hover { color: var(--text2); background: var(--bg3); }
  .view-tab.active { color: var(--accent); background: rgba(200,240,96,0.08); }

  .post-btn {
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    border-radius: var(--radius);
    padding: 7px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; gap: 6px;
  }
  .post-btn:hover { background: #d6f577; }
  .post-btn:active { transform: scale(0.97); }

  /* FEED */
  .feed-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }
  .feed-wrap::-webkit-scrollbar { width: 3px; }
  .feed-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }
  .empty-state .big { font-size: 32px; }

  .track-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    background: var(--bg2);
    transition: border-color 0.15s;
    animation: slideIn 0.2s ease;
  }
  .track-card:hover { border-color: var(--border2); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text2);
  }
  .card-dot { color: var(--text3); }
  .card-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid;
    letter-spacing: 0.04em;
  }
  .card-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .card-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    white-space: nowrap;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .track-card:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: #f06060; }

  .stream-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stream-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text2);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    text-decoration: none;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .stream-link:hover {
    color: var(--accent);
    border-color: rgba(200,240,96,0.3);
    background: rgba(200,240,96,0.05);
  }
  .stream-link svg { width: 12px; height: 12px; fill: currentColor; }

  /* GENRE COLORS */
  .g-electronic { color: #7dd3fc; border-color: rgba(125,211,252,0.3); }
  .g-metal      { color: #fca5a5; border-color: rgba(252,165,165,0.3); }
  .g-jazz       { color: #86efac; border-color: rgba(134,239,172,0.3); }
  .g-hiphop     { color: #c084fc; border-color: rgba(192,132,252,0.3); }
  .g-rock       { color: #fb923c; border-color: rgba(251,146,60,0.3); }
  .g-classical  { color: #f9a8d4; border-color: rgba(249,168,212,0.3); }
  .g-ambient    { color: #67e8f9; border-color: rgba(103,232,249,0.3); }
  .g-other      { color: #d6d3d1; border-color: rgba(214,211,209,0.3); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(3px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 28px;
    width: 480px;
    max-width: 95vw;
    animation: popIn 0.18s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  .modal-title {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 20px;
    letter-spacing: 0.04em;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--border2); }
  .form-group input::placeholder { color: var(--text3); }

  .links-section {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 14px;
    background: var(--bg3);
  }
  .links-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .link-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .link-row select {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
  }
  .link-row input {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
  }
  .link-row input:focus { border-color: var(--border2); }
  .link-row input::placeholder { color: var(--text3); }
  .add-link-btn {
    background: none;
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    width: 100%;
    padding: 6px;
    transition: color 0.15s, border-color 0.15s;
    margin-top: 4px;
  }
  .add-link-btn:hover { color: var(--text2); border-color: var(--border2); }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 6px;
  }
  .btn-cancel {
    padding: 8px 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-cancel:hover { border-color: var(--border2); }
  .btn-post {
    padding: 8px 20px;
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-post:hover { background: #d6f577; }

  /* ICONS inline SVGs */
  .ico { display: inline-flex; align-items: center; }

  /* NOTIFICATION */
  .notif {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    z-index: 200;
    animation: notifIn 0.2s ease;
    pointer-events: none;
  }
  @keyframes notifIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">MUSIK<span>.feed</span></div>
  <div class="header-right">
    <span class="tag-count" id="track-count">0 tracks</span>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">Bibliothek</div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-input" placeholder="Suchen…" oninput="renderAll()">
      </div>
    </div>
    <div class="tree-scroll" id="tree"></div>
  </div>

  <div class="main">
    <div class="main-bar">
      <div class="view-tabs">
        <button class="view-tab active" onclick="setView('feed',this)">Feed</button>
        <button class="view-tab" onclick="setView('genre',this)">Genre</button>
      </div>
      <button class="post-btn" onclick="openModal()">+ Track posten</button>
    </div>
    <div class="feed-wrap" id="feed-wrap"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title">// neuen track posten</div>
    <div class="form-row">
      <div class="form-group">
        <label>Titel *</label>
        <input type="text" id="f-title" placeholder="Trackname">
      </div>
      <div class="form-group">
        <label>Band / Artist *</label>
        <input type="text" id="f-band" placeholder="Artist">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Genre *</label>
        <select id="f-genre">
          <option value="Electronic">Electronic</option>
          <option value="Metal">Metal</option>
          <option value="Jazz">Jazz</option>
          <option value="Hip-Hop">Hip-Hop</option>
          <option value="Rock">Rock</option>
          <option value="Classical">Classical</option>
          <option value="Ambient">Ambient</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notiz (optional)</label>
        <input type="text" id="f-note" placeholder="kurze Beschreibung">
      </div>
    </div>

    <div class="links-section">
      <div class="links-section-label">Streaming-Links</div>
      <div id="link-rows"></div>
      <button class="add-link-btn" onclick="addLinkRow()">+ Link hinzufügen</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="btn-post" onclick="postTrack()">Posten</button>
    </div>
  </div>
</div>

<script>
const PLATFORMS = ['Spotify','YouTube','Bandcamp','Apple Music','Tidal','SoundCloud','Deezer','Amazon Music','Boomkat','Discogs'];
const GENRE_CLASS = {
  'Electronic':'g-electronic','Metal':'g-metal','Jazz':'g-jazz',
  'Hip-Hop':'g-hiphop','Rock':'g-rock','Classical':'g-classical',
  'Ambient':'g-ambient','Other':'g-other'
};
const PLATFORM_ICONS = {
  'Spotify': '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>',
  'YouTube': '<svg viewBox="0 0 24 24"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>',
  'Bandcamp': '<svg viewBox="0 0 24 24"><path d="M0 18.75l7.437-13.5H24l-7.438 13.5z"/></svg>',
  'SoundCloud': '<svg viewBox="0 0 24 24"><path d="M11.56 8.87V17h8.76c1.44-.02 2.59-1.19 2.59-2.63 0-1.45-1.17-2.62-2.62-2.62-.29 0-.57.04-.83.12-.24-2.26-2.14-4.03-4.46-4.03-1.3 0-2.48.5-3.44 1.03m-1.5 8.13H1.23C.55 17 0 16.45 0 15.77v-.08c0-.68.55-1.23 1.23-1.23h8.83V17z"/></svg>',
  'default': '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>'
};

let tracks = [];
let currentView = 'feed';
let linkRowCount = 0;

function load() {
  try { tracks = JSON.parse(localStorage.getItem('musik-feed-tracks') || '[]'); } catch(e) { tracks = []; }
}
function save() {
  localStorage.setItem('musik-feed-tracks', JSON.stringify(tracks));
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'gerade eben';
  if (diff < 3600) return Math.floor(diff/60) + ' min';
  if (diff < 86400) return Math.floor(diff/3600) + ' h';
  if (diff < 604800) return Math.floor(diff/86400) + ' Tage';
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'});
}

function getIcon(platform) {
  return PLATFORM_ICONS[platform] || PLATFORM_ICONS['default'];
}

function renderStreamLinks(links) {
  return links.map(l =>
    `<a class="stream-link" href="${escHtml(l.url)}" target="_blank" rel="noopener">
      <span class="ico">${getIcon(l.platform)}</span>${escHtml(l.platform)}
    </a>`
  ).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getQuery() { return document.getElementById('search-input').value.toLowerCase().trim(); }

function filteredTracks() {
  const q = getQuery();
  if (!q) return tracks;
  return tracks.filter(t =>
    t.title.toLowerCase().includes(q) ||
    t.band.toLowerCase().includes(q) ||
    t.genre.toLowerCase().includes(q) ||
    (t.note && t.note.toLowerCase().includes(q))
  );
}

function renderFeed() {
  const wrap = document.getElementById('feed-wrap');
  const list = filteredTracks();
  if (list.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="big">♪</div><div>${getQuery() ? 'Keine Treffer.' : 'Noch keine Tracks. Poste deinen ersten!'}</div></div>`;
    return;
  }
  wrap.innerHTML = list.map((t,i) => {
    const gc = GENRE_CLASS[t.genre] || 'g-other';
    const links = t.links && t.links.length ? renderStreamLinks(t.links) : '<span style="color:var(--text3);font-size:11px;">keine Links</span>';
    return `<div class="track-card">
      <div class="card-top">
        <div class="card-meta-wrap">
          <div class="card-title">${escHtml(t.title)}</div>
          <div class="card-meta">
            <span>${escHtml(t.band)}</span>
            <span class="card-dot">·</span>
            <span class="card-badge ${gc}">${escHtml(t.genre)}</span>
            ${t.note ? `<span class="card-dot">·</span><span style="color:var(--text3);font-size:11px;font-style:italic;">${escHtml(t.note)}</span>` : ''}
          </div>
        </div>
        <div class="card-right">
          <span class="card-date">${formatDate(t.date)}</span>
          <button class="delete-btn" onclick="deleteTrack(${list.indexOf(tracks.find(x=>x===t))})" title="Löschen">✕</button>
        </div>
      </div>
      <div class="stream-links">${links}</div>
    </div>`;
  }).join('');
}

function renderGenreView() {
  const wrap = document.getElementById('feed-wrap');
  const list = filteredTracks();
  const byGenre = {};
  list.forEach(t => {
    if (!byGenre[t.genre]) byGenre[t.genre] = {};
    if (!byGenre[t.genre][t.band]) byGenre[t.genre][t.band] = [];
    byGenre[t.genre][t.band].push(t);
  });
  if (Object.keys(byGenre).length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="big">♪</div><div>Keine Tracks gefunden.</div></div>`;
    return;
  }
  let html = '';
  for (const genre in byGenre) {
    const gc = GENRE_CLASS[genre] || 'g-other';
    html += `<div style="margin-bottom:20px;">
      <div style="font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);">
        <span class="card-badge ${gc}" style="font-size:10px;">${escHtml(genre)}</span>
      </div>`;
    for (const band in byGenre[genre]) {
      html += `<div style="margin-bottom:12px;">
        <div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px;padding-left:4px;">${escHtml(band)}</div>`;
      byGenre[genre][band].forEach(t => {
        const links = t.links && t.links.length ? renderStreamLinks(t.links) : '';
        html += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:13px;color:var(--text);">${escHtml(t.title)}</span>
            <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);">${formatDate(t.date)}</span>
          </div>
          <div class="stream-links">${links}</div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }
  wrap.innerHTML = html;
}

function renderTree() {
  const tree = document.getElementById('tree');
  const byGenre = {};
  tracks.forEach(t => {
    if (!byGenre[t.genre]) byGenre[t.genre] = {};
    if (!byGenre[t.genre][t.band]) byGenre[t.genre][t.band] = [];
    byGenre[t.genre][t.band].push(t);
  });
  if (Object.keys(byGenre).length === 0) {
    tree.innerHTML = `<div style="padding:20px 16px;color:var(--text3);font-size:11px;font-family:'DM Mono',monospace;">leer</div>`;
    return;
  }
  let html = '';
  for (const genre in byGenre) {
    const gc = GENRE_CLASS[genre] || 'g-other';
    const totalTracks = Object.values(byGenre[genre]).reduce((a,b) => a+b.length, 0);
    const gid = 'g-' + genre.replace(/\s+/g,'-');
    html += `
      <div class="genre-row" onclick="toggleGenre('${gid}')" id="row-${gid}">
        <span class="genre-arrow" id="arrow-${gid}">▶</span>
        <span class="genre-dot" style="color:var(--${gc.replace('g-','')}-color, var(--text2))"></span>
        ${escHtml(genre)}
        <span class="genre-count">${totalTracks}</span>
      </div>
      <div class="band-group" id="${gid}">`;
    for (const band in byGenre[genre]) {
      const bid = gid + '-' + band.replace(/\s+/g,'-');
      html += `
        <div class="band-row" onclick="toggleBand('${bid}')" id="row-${bid}">
          <span class="band-arrow" id="arrow-${bid}">▶</span>
          ${escHtml(band)}
        </div>
        <div class="track-group" id="${bid}">
          ${byGenre[genre][band].map(t => `<div class="track-row" title="${escHtml(t.title)}">${escHtml(t.title)}</div>`).join('')}
        </div>`;
    }
    html += `</div>`;
  }
  tree.innerHTML = html;
}

function toggleGenre(id) {
  document.getElementById(id).classList.toggle('open');
  document.getElementById('arrow-'+id).classList.toggle('open');
}
function toggleBand(id) {
  document.getElementById(id).classList.toggle('open');
  document.getElementById('arrow-'+id).classList.toggle('open');
}

function setView(v, el) {
  currentView = v;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderFeed2();
}

function renderFeed2() {
  if (currentView === 'genre') renderGenreView();
  else renderFeed();
}

function renderAll() {
  renderTree();
  renderFeed2();
  document.getElementById('track-count').textContent = tracks.length + ' track' + (tracks.length !== 1 ? 's' : '');
}

/* MODAL */
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('link-rows').innerHTML = '';
  linkRowCount = 0;
  addLinkRow();
  setTimeout(() => document.getElementById('f-title').focus(), 50);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function overlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

function addLinkRow() {
  const id = linkRowCount++;
  const opts = PLATFORMS.map(p => `<option value="${p}">${p}</option>`).join('');
  const row = document.createElement('div');
  row.className = 'link-row';
  row.id = 'lr-' + id;
  row.innerHTML = `
    <select class="lr-platform">${opts}</select>
    <input type="url" class="lr-url" placeholder="https://…">`;
  document.getElementById('link-rows').appendChild(row);
}

function postTrack() {
  const title = document.getElementById('f-title').value.trim();
  const band  = document.getElementById('f-band').value.trim();
  const genre = document.getElementById('f-genre').value;
  const note  = document.getElementById('f-note').value.trim();
  if (!title || !band) { alert('Titel und Artist sind Pflichtfelder.'); return; }

  const links = [];
  document.querySelectorAll('.link-row').forEach(row => {
    const platform = row.querySelector('.lr-platform').value;
    const url = row.querySelector('.lr-url').value.trim();
    if (url) links.push({ platform, url });
  });

  tracks.unshift({ title, band, genre, note, links, date: new Date().toISOString() });
  save();
  closeModal();
  renderAll();
  notify('Track gepostet ✓');

  document.getElementById('f-title').value = '';
  document.getElementById('f-band').value = '';
  document.getElementById('f-note').value = '';
}

function deleteTrack(idx) {
  if (!confirm('Track löschen?')) return;
  tracks.splice(idx, 1);
  save();
  renderAll();
}

function notify(msg) {
  const n = document.createElement('div');
  n.className = 'notif';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2200);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openModal(); }
});

load();
renderAll();
</script>
</body>
</html>
